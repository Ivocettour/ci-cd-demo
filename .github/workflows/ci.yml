name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality, tests and local build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript and JSON syntax
        run: npm run validate:syntax

      - name: Run static analysis
        run: npm run lint

      - name: Validate OpenAPI contract
        run: npm run validate:openapi

      - name: Run tests
        run: npm test

      - name: Run local build command
        run: npm run build

      - name: Upload API contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: docs/openapi.json
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ci-cd-demo:${{ github.sha }} .

      - name: Smoke test Docker image
        run: |
          docker run --rm -d -p 3000:3000 --name ci-cd-demo-smoke ci-cd-demo:${{ github.sha }}
          trap "docker stop ci-cd-demo-smoke" EXIT
          sleep 3
          curl --fail http://localhost:3000/health

      - name: Export Docker image artifact
        run: docker save ci-cd-demo:${{ github.sha }} -o ci-cd-demo-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ci-cd-demo-image.tar
          if-no-files-found: error

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: docker
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets are not configured; deploy was skipped."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Notify WhatsApp success
        if: steps.vercel-deploy.outputs.deployed == 'true'
        env:
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO || '+5493482299620' }}
        run: |
          if [ -z "$CALLMEBOT_APIKEY" ] || [ -z "$WHATSAPP_TO" ]; then
            echo "::warning::WhatsApp secrets are not configured; notification was skipped."
            exit 0
          fi

          curl --fail --get "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=$WHATSAPP_TO" \
            --data-urlencode "text=todo funciona" \
            --data-urlencode "apikey=$CALLMEBOT_APIKEY"
